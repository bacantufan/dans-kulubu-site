<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUDANSK | Bilet Görüntüle</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{
      --bg:#08080d;
      --text:#f8f6f2;
      --muted:#c6bfd3;
      --gold:#f4c56c;
      --line:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,system-ui,sans-serif;
      background:linear-gradient(180deg,#06070b 0%, #0b0c13 40%, #08090d 100%);
      color:var(--text);
    }
    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(100%,700px);
      border-radius:28px;
      background:rgba(255,255,255,.05);
      border:1px solid var(--line);
      padding:24px;
      box-shadow:0 20px 50px rgba(0,0,0,.35);
    }
    .mini{
      font-size:12px;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:var(--gold);
      font-weight:800;
      margin-bottom:8px;
    }
    h1{
      margin:0 0 10px;
      font-size:34px;
      letter-spacing:-.04em;
    }
    p{
      color:var(--muted);
      line-height:1.7;
      margin:0 0 18px;
    }
    .info{
      display:grid;
      gap:12px;
      margin-bottom:20px;
    }
    .row{
      padding:14px;
      border-radius:18px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .row small{
      display:block;
      color:var(--muted);
      margin-bottom:4px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .row strong{
      font-size:16px;
      word-break:break-word;
    }
    .qr-wrap{
      margin-top:18px;
      text-align:center;
      padding:20px;
      border-radius:22px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
    }
    .qr-box{
      display:inline-block;
      background:#fff;
      padding:14px;
      border-radius:20px;
      margin-top:10px;
    }
    .qr-box img{
      width:min(100%,280px);
      height:auto;
      display:block;
    }
    .error{
      color:#ffd2d2;
      background:rgba(255,127,127,.08);
      border:1px solid rgba(255,127,127,.18);
      padding:14px;
      border-radius:16px;
    }
    .loading{
      color:var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="mini">YUDANSK Bilet</div>
      <h1>Bilet Görüntüleme</h1>
      <p>QR görünmüyorsa veya mail spam klasörüne düştüyse biletini buradan açabilirsin.</p>

      <div id="content" class="loading">Bilet bilgileri yükleniyor...</div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://aslwragnzivojorpyuas.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_D9C-flgUHSMEk68O2UfmHQ_eE_ZQyAw";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: false,
          autoRefreshToken: false,
          detectSessionInUrl: false
        }
      }
    );

    const params = new URLSearchParams(window.location.search);
    const ticketCode = params.get("code");
    const content = document.getElementById("content");

    async function loadTicket() {
      if (!ticketCode) {
        content.innerHTML = '<div class="error">Geçersiz link. Bilet kodu bulunamadı.</div>';
        return;
      }

      const { data, error } = await supabaseClient
        .from("registrations")
        .select("ticket_code, attendee_name, full_name, attendance_date, status, checked_in")
        .eq("ticket_code", ticketCode)
        .limit(1)
        .maybeSingle();

      if (error || !data) {
        content.innerHTML = '<div class="error">Bilet bulunamadı.</div>';
        return;
      }

      if (data.status === "CANCELLED") {
        content.innerHTML = '<div class="error">Bu bilet iptal edilmiş.</div>';
        return;
      }

      const qrUrl = `/api/qr?ticket=${encodeURIComponent(data.ticket_code)}`;

      content.innerHTML = `
        <div class="info">
          <div class="row">
            <small>Bilet Kodu</small>
            <strong>${escapeHtml(data.ticket_code)}</strong>
          </div>
          <div class="row">
            <small>Bilet Sahibi</small>
            <strong>${escapeHtml(data.attendee_name || data.full_name || "-")}</strong>
          </div>
          <div class="row">
            <small>Temsil Günü</small>
            <strong>${escapeHtml(data.attendance_date || "-")}</strong>
          </div>
          <div class="row">
            <small>Durum</small>
            <strong>${data.checked_in ? "Kullanıldı" : "Geçerli"}</strong>
          </div>
        </div>

        <div class="qr-wrap">
          <div class="mini" style="margin-bottom:0;">QR Giriş Kodu</div>
          <div class="qr-box">
            <img src="${qrUrl}" alt="QR Kod">
          </div>
        </div>
      `;
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    loadTicket();
  </script>
</body>
</html>
