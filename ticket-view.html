<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yudansk Magazine | Bilet Görüntüle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <style>
    :root{
      --bg:#080507;
      --panel:rgba(255,255,255,.06);
      --line:rgba(255,255,255,.10);
      --text:#f7f1ea;
      --muted:#cdbfb8;
      --red:#c60a10;
      --bordeaux:#57040f;
      --gold:#f4c56c;
      --shadow:0 20px 50px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"Inter",system-ui,sans-serif;
      background:
        radial-gradient(circle at top left, rgba(198,10,16,.18), transparent 28%),
        radial-gradient(circle at top right, rgba(87,4,15,.24), transparent 26%),
        linear-gradient(180deg,#060407 0%, #0b0609 40%, #070507 100%);
      color:var(--text);
    }

    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }

    .shell{
      width:min(100%, 820px);
    }

    .head{
      text-align:center;
      margin-bottom:18px;
    }

    .eyebrow{
      display:inline-block;
      padding:9px 14px;
      border-radius:999px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      color:#f0d6cb;
      font-size:12px;
      font-weight:800;
      letter-spacing:.16em;
      text-transform:uppercase;
    }

    h1{
      margin:18px 0 8px;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(44px,7vw,78px);
      line-height:.92;
      letter-spacing:-.04em;
    }

    .lead{
      margin:0 auto;
      max-width:620px;
      color:var(--muted);
      line-height:1.85;
      font-size:15px;
    }

    .ticket-card{
      width:100%;
      border-radius:34px;
      overflow:hidden;
      background:
        radial-gradient(circle at top left, rgba(198,10,16,.2), transparent 28%),
        linear-gradient(135deg,#141626 0%, #0f1018 45%, #57040f 100%);
      border:1px solid rgba(255,255,255,.1);
      box-shadow:var(--shadow);
    }

    .ticket-inner{
      display:grid;
      gap:0;
    }

    @media (min-width: 760px){
      .ticket-inner{
        grid-template-columns:1.06fr .94fr;
      }
    }

    .ticket-left{
      padding:28px 24px 26px;
      border-right:1px dashed rgba(255,255,255,.12);
    }

    .ticket-right{
      padding:28px 24px 26px;
      background:rgba(255,255,255,.03);
      text-align:center;
    }

    .section-mini{
      font-size:12px;
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-weight:800;
      margin-bottom:10px;
    }

    .ticket-title{
      margin:0 0 16px;
      font-family:"Cormorant Garamond",serif;
      font-size:42px;
      line-height:.92;
      letter-spacing:-.04em;
    }

    .info-grid{
      display:grid;
      gap:12px;
    }

    .row{
      padding:14px 16px;
      border-radius:18px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
    }

    .row small{
      display:block;
      color:#b7bdcb;
      margin-bottom:5px;
      font-size:12px;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .row strong{
      display:block;
      font-size:16px;
      line-height:1.6;
      word-break:break-word;
    }

    .qr-wrap{
      margin-top:8px;
    }

    .qr-box{
      display:inline-block;
      background:#fff;
      padding:14px;
      border-radius:22px;
      margin-top:10px;
      box-shadow:0 12px 30px rgba(0,0,0,.18);
    }

    .qr-box img{
      width:min(100%,280px);
      height:auto;
      display:block;
    }

    .hint{
      margin-top:14px;
      color:#ded4da;
      font-size:13px;
      line-height:1.8;
    }

    .error{
      color:#ffd2d2;
      background:rgba(255,127,127,.08);
      border:1px solid rgba(255,127,127,.18);
      padding:14px;
      border-radius:16px;
    }

    .loading{
      color:var(--muted);
      padding:16px 0 0;
      text-align:center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="shell">
      <div class="head">
        <div class="eyebrow">Yudansk Magazine • 21. Dans Festivali</div>
        <h1>Bilet Görüntüleme</h1>
        <p class="lead">
          QR görünmüyorsa veya mail görselleri eksik yükleniyorsa biletini buradan açabilirsin.
        </p>
      </div>

      <div id="content" class="loading">Bilet bilgileri yükleniyor...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ticketCode = params.get("code");
    const content = document.getElementById("content");

    async function loadTicket() {
      if (!ticketCode) {
        content.innerHTML = '<div class="error">Geçersiz link. Bilet kodu bulunamadı.</div>';
        return;
      }

      try {
        const response = await fetch(`/api/ticket-view?code=${encodeURIComponent(ticketCode)}`);
        const result = await response.json();

        if (!response.ok || !result.success || !result.ticket) {
          content.innerHTML = `<div class="error">${escapeHtml(result.error || "Bilet bulunamadı.")}</div>`;
          return;
        }

        const data = result.ticket;
        const qrUrl = `/api/qr?ticket=${encodeURIComponent(data.ticket_code)}`;

        content.innerHTML = `
          <div class="ticket-card">
            <div class="ticket-inner">
              <div class="ticket-left">
                <div class="section-mini">Event Ticket</div>
                <h2 class="ticket-title">Yudansk Magazine</h2>

                <div class="info-grid">
                  <div class="row">
                    <small>Bilet Kodu</small>
                    <strong>${escapeHtml(data.ticket_code)}</strong>
                  </div>

                  <div class="row">
                    <small>Bilet Sahibi</small>
                    <strong>${escapeHtml(data.attendee_name || data.full_name || "-")}</strong>
                  </div>

                  <div class="row">
                    <small>Etkinlik</small>
                    <strong>Yudansk Magazine • 21. Dans Festivali</strong>
                  </div>

                  <div class="row">
                    <small>Tarih & Saat</small>
                    <strong>5 Mayıs 2026 • 19.00</strong>
                  </div>

                  <div class="row">
                    <small>Mekan</small>
                    <strong>Yeditepe Üniversitesi İnan Kıraç Salonu</strong>
                  </div>

                  <div class="row">
                    <small>Durum</small>
                    <strong>${data.checked_in ? "Kullanıldı" : "Geçerli"}</strong>
                  </div>
                </div>
              </div>

              <div class="ticket-right">
                <div class="section-mini">QR Giriş Kodu</div>
                <div class="qr-wrap">
                  <div class="qr-box">
                    <img src="${qrUrl}" alt="QR Kod">
                  </div>
                </div>
                <p class="hint">
                  Etkinlik girişinde bu QR kodu görevliye göstermen yeterlidir.
                </p>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        content.innerHTML = '<div class="error">Bilet bilgileri alınamadı.</div>';
      }
    }

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    loadTicket();
  </script>
</body>
</html>
